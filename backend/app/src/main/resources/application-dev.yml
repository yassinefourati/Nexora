spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/admin_db
    username: admin_backend
    password: secret
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  docker:
    compose:
      enabled: true
      file: ../docker-compose.yml
      profiles:
        active: infra
      lifecycle-management: start-and-stop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fourati-realm

logging:
  file:
    path: logs/dev
  level:
    root: INFO
    com.fourati: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    enabled: true

# Shared stores + STOMP relay from the infra profile (Redis/RabbitMQ on localhost)
fourati.common.store: ${STORE:redis}
app.websocket.relay.enabled: ${WS_RELAY_ENABLED:true}
management.health.redis.enabled: true
