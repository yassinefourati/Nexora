# ─── Validation messages ────────────────────────────────────────────────────
# Referenced in DTO annotations as: @NotBlank(message = "{item.name.required}")
# Spring automatically loads this file for Bean Validation message interpolation.
#
# Usage example:
#   public record CreateItemRequest(
#       @NotBlank(message = "{item.name.required}")
#       @Size(max = 255, message = "{item.name.too-long}")
#       String name,
#       ...
#   ) {}

# ── Item ─────────────────────────────────────────────────────────────────────
item.name.required=Item name is required
item.name.too-long=Item name must not exceed {max} characters
item.description.too-long=Item description must not exceed {max} characters

# ── Document ──────────────────────────────────────────────────────────────────
document.filename.required=File name is required
document.content-type.required=Content type is required

# ── Common ────────────────────────────────────────────────────────────────────
field.required=This field is required
field.too-long=Must not exceed {max} characters
field.too-short=Must be at least {min} characters
field.invalid-uuid=Must be a valid UUID
field.invalid-email=Must be a valid email address
field.positive=Must be a positive number
