spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

logging:
  file:
    path: ${LOG_PATH:/var/log/admin-api}
  level:
    root: INFO
    com.fourati: INFO

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false