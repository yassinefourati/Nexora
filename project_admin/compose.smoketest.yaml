services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: admin_backend
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_backend -d admin_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: admin-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin_db
      SPRING_DATASOURCE_USERNAME: admin_backend
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:9090/realms/fourati-realm
    ports:
      - "8080:8080"
