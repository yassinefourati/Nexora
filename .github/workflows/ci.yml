name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven multi-module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project_admin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Test + architecture checks (full reactor)
        run: ./mvnw verify -pl test -am --no-transfer-progress
        # Testcontainers needs a Docker daemon — ubuntu-latest runners have
        # one preinstalled at /var/run/docker.sock, unlike local Windows/
        # Docker Desktop npipe setups where this can fail. See NEXT_STEPS.md.

      - name: Build Docker image
        run: docker build -t admin-api:ci .

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
