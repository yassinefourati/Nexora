name: CI

# Path-filtered so a docs-only change costs nothing. Each job is independent;
# `images` and `deploy-staging` only run on main once everything is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/admin-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/admin-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'docker-compose.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit + architecture + Testcontainers integration tests (Docker is available on ubuntu-latest)
      - name: Verify
        run: ./mvnw -B --no-transfer-progress verify
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/test/target/surefire-reports
          retention-days: 7
      - name: Package jar
        run: ./mvnw -B --no-transfer-progress -q package -DskipTests -Dmaven.test.skip=true -pl presentation -am
      - uses: actions/upload-artifact@v4
        with:
          name: admin-api-jar
          path: backend/presentation/target/admin-api.jar
          retention-days: 7

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  dependency-scan:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (lockfiles, poms)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'   # report-only until the baseline is clean, then flip to '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  e2e:
    # Real stack, not MSW: catches frontend/backend contract drift.
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose --profile app up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          BASE_URL: http://localhost:5173
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile app logs --tail=200
      - if: always()
        run: docker compose --profile app down -v

  images:
    # Build, scan and push both images tagged with the commit SHA (and latest on main).
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build admin-api
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build admin-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ env.IMAGE_WEB }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.STAGING_API_URL || 'http://localhost:8080/api/v1' }}
            VITE_OIDC_AUTHORITY=${{ vars.STAGING_OIDC_AUTHORITY || 'http://localhost:9090/realms/fourati-realm' }}
            VITE_OIDC_CLIENT_ID=admin-frontend
            VITE_OIDC_REDIRECT_URI=${{ vars.STAGING_WEB_URL || 'http://localhost:5173' }}/auth/callback
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI=${{ vars.STAGING_WEB_URL || 'http://localhost:5173' }}/login
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan admin-api image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan admin-frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push
        run: |
          for img in "$IMAGE_API" "$IMAGE_WEB"; do
            docker push "$img:${{ github.sha }}"
            docker tag "$img:${{ github.sha }}" "$img:latest"
            docker push "$img:latest"
          done
      - name: Sign images (keyless, Sigstore)
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes "$IMAGE_API:${{ github.sha }}"
          cosign sign --yes "$IMAGE_WEB:${{ github.sha }}"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_API }}:${{ github.sha }}
          artifact-name: admin-api-sbom.spdx.json

  deploy-staging:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging   # protect this environment in repo settings to require a reviewer
    steps:
      - uses: actions/checkout@v4
      - name: Render manifests for this SHA
        run: |
          cd deploy/k8s/overlays/staging
          kubectl kustomize . > /dev/null
          kustomize edit set image admin-api=${IMAGE_API}:${{ github.sha }} admin-frontend=${IMAGE_WEB}:${{ github.sha }}
      - name: Apply
        if: ${{ secrets.STAGING_KUBECONFIG != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -k deploy/k8s/overlays/staging
          kubectl -n project-admin rollout status deploy/admin-api --timeout=300s
          kubectl -n project-admin rollout status deploy/admin-frontend --timeout=120s
      - name: No cluster configured
        if: ${{ secrets.STAGING_KUBECONFIG == '' }}
        run: echo "STAGING_KUBECONFIG secret not set; manifests rendered but not applied."
