apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  labels: { app: admin-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: admin-frontend }
  template:
    metadata:
      labels: { app: admin-frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          # Built with VITE_* build args pointing at the public API/Keycloak URLs
          # (see frontend/Dockerfile); the image is environment-specific.
          image: admin-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
spec:
  selector: { app: admin-frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
