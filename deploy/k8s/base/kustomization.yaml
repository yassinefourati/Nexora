apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project-admin
resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - dependencies.yaml

# Secrets are NOT in this repo. Create them out of band, for example:
#
#   kubectl -n project-admin create secret generic admin-api-secrets \
#     --from-literal=SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/admin_db \
#     --from-literal=SPRING_DATASOURCE_USERNAME=admin_backend \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=... \
#     --from-literal=SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://auth.example.com/realms/fourati-realm \
#     --from-literal=APP_CORS_ALLOWED_ORIGINS=https://admin.example.com \
#     --from-literal=WS_RELAY_USERNAME=... \
#     --from-literal=WS_RELAY_PASSWORD=...
#
#   kubectl -n project-admin create secret generic rabbitmq-secrets \
#     --from-literal=RABBITMQ_DEFAULT_USER=... \
#     --from-literal=RABBITMQ_DEFAULT_PASS=...
