# Round-robin over the two admin-api replicas of the `scale` compose profile.
# Docker DNS resolves the service name to every replica; `resolver` keeps nginx
# re-resolving instead of pinning the first address it saw at start-up.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;

  location / {
    set $upstream http://admin-api-scaled:8080;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket / SockJS
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
