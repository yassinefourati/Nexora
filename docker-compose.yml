# One compose file, selected by profiles (docker compose --profile <name> up -d):
#
#   infra          Postgres + Keycloak + Redis + RabbitMQ           (backend run from the IDE / `make run`)
#   app            infra + admin-api + frontend                      (the whole product on one machine)
#   scale          same as app but two admin-api replicas behind nginx on :8080 (proves shared state works)
#   observability  OTel collector + Tempo + Prometheus + Grafana on :3000
#   loadtest       k6 runner against whatever is up on :8080 (see deploy/loadtest/README.md)
#
# Profiles combine: `docker compose --profile app --profile observability up -d`.
# Secrets come from .env (copy .env.example). Nothing here is production configuration.

x-api-env: &api-env
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  # Token `iss` claims carry the browser-facing Keycloak URL; JWKS is fetched over the compose network.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:9090/realms/fourati-realm
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fourati-realm/protocol/openid-connect/certs
  RATE_LIMIT_RPM: ${RATE_LIMIT_RPM}
  STORE: redis
  REDIS_HOST: redis
  WS_RELAY_ENABLED: "true"
  WS_RELAY_HOST: rabbitmq
  WS_RELAY_USERNAME: ${RABBITMQ_USER:-guest}
  WS_RELAY_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"   # only the compose nginx sits in front

x-api-healthcheck: &api-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:

  # ---------------------------------------------------------------- infra --
  postgres:
    image: postgres:17-alpine
    profiles: [infra, app, scale, loadtest]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"   # 5432 is commonly taken by a native Postgres install
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [infra, app, scale, loadtest]
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Fixed issuer: tokens carry iss=http://localhost:9090/... whichever host name the
      # token request used (browser, k6 via host.docker.internal, containers via keycloak:8080),
      # so the API's issuer-uri validation is satisfied from everywhere.
      KC_HOSTNAME: http://localhost:9090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "9090:8080"   # matches issuer-uri http://localhost:9090/realms/fourati-realm
    volumes:
      - ./deploy/keycloak/fourati-realm.json:/opt/keycloak/data/import/fourati-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }

  redis:
    image: redis:7-alpine
    profiles: [infra, app, scale, loadtest]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [infra, app, scale, loadtest]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "61613:61613"   # STOMP (backend relay, and for running the backend from the IDE)
      - "15672:15672"   # management UI
    volumes:
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # ------------------------------------------------------------------ app --
  admin-api:
    build:
      context: ./backend
    image: admin-api:latest
    profiles: [app, loadtest]
    restart: unless-stopped
    environment: *api-env
    ports:
      - "8080:8080"
      - "8081:8081"   # management: health + prometheus, not for the ingress
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *api-healthcheck
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }

  # Two replicas behind nginx, same image. Only one of admin-api / admin-api-scaled
  # should be up at a time (both want :8080 on the host).
  admin-api-scaled:
    build:
      context: ./backend
    image: admin-api:latest
    profiles: [scale]
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *api-healthcheck
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.5", memory: 1280M }

  api-lb:
    image: nginx:1.31-alpine
    profiles: [scale]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/loadtest/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      admin-api-scaled: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
        VITE_OIDC_AUTHORITY: http://localhost:9090/realms/fourati-realm
        VITE_OIDC_CLIENT_ID: admin-frontend
        VITE_OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:5173/login
    image: admin-frontend:latest
    profiles: [app, scale]
    restart: unless-stopped
    ports:
      - "5173:8080"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # -------------------------------------------------------- observability --
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (backend exports here when run from the IDE)
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo]

  # --------------------------------------------------------------- loadtest --
  k6:
    image: grafana/k6:0.54.0
    profiles: [loadtest]
    environment:
      BASE_URL: ${K6_BASE_URL:-http://host.docker.internal:8080}
      KEYCLOAK_URL: ${K6_KEYCLOAK_URL:-http://host.docker.internal:9090}
      K6_USERNAME: ${K6_USERNAME:-superadmin}
      K6_PASSWORD: ${K6_PASSWORD:-ChangeMe123!}
      K6_VUS: ${K6_VUS:-20}
      K6_DURATION: ${K6_DURATION:-60s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/loadtest:/scripts:ro
      - ./deploy/loadtest/results:/results
    command: ["run", "--summary-export=/results/summary.json", "/scripts/k6-api.js"]

volumes:
  postgres_data:
  tempo_data:
  prometheus_data:
  grafana_data:
