server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # ── Security headers ──────────────────────────────────────────────────────
  # Note: add_header directives in child location blocks override (not inherit)
  # the server-level ones, so headers are repeated in each location block.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # MUI/Emotion requires 'unsafe-inline' for styles; data: URIs used for base64 images
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 ws://localhost:8080 http://localhost:9090 https://*.sentry.io; frame-ancestors 'none';" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets — long-lived cache + security headers repeated (child block override)
  location ~* \.(js|css|png|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 ws://localhost:8080 http://localhost:9090 https://*.sentry.io; frame-ancestors 'none';" always;
  }
}
